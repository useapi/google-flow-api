identity:
  name: agent_get_chat
  author: useapi
  label:
    en_US: Get Google Flow agent chat
    zh_Hans: 获取 Google Flow 智能体对话
    ja_JP: Google Flow エージェントのチャットを取得
    pt_BR: Ver chat do agente do Google Flow
description:
  human:
    en_US: 'Read an agent chat: its status, the latest reply, the approval it waits for, and the images and videos with fresh links.'
    zh_Hans: 读取智能体对话：状态、最新回复、等待的批准，以及带新链接的图片和视频。
    ja_JP: エージェントのチャットを読み取ります：状態、最新の返信、承認待ちの内容、新しいリンク付きの画像と動画。
    pt_BR: 'Lê um chat do agente: status, última resposta, a aprovação pendente e as imagens e vídeos com links novos.'
  llm: Read a Google Flow agent chat. With wait=true, waits until the running turn ends and its videos finish (up to max_wait). Videos usually finish a minute or two after the turn.
parameters:
- name: chat_id
  type: string
  required: true
  label:
    en_US: Chat ID
    zh_Hans: 对话 ID
    ja_JP: チャット ID
    pt_BR: ID do chat
  human_description:
    en_US: The chat_id returned by Google Flow agent chat.
    zh_Hans: “Google Flow 智能体对话”返回的对话 ID。
    ja_JP: 「Google Flow エージェントとチャット」で返された chat_id。
    pt_BR: O chat_id retornado por Chat com o agente do Google Flow.
  llm_description: The chat_id from agent_chat or agent_list_chats.
  form: llm
- name: wait
  type: boolean
  required: false
  label:
    en_US: Wait for the turn and videos
    zh_Hans: 等待本轮和视频
    ja_JP: ターンと動画を待つ
    pt_BR: Aguardar o turno e os vídeos
  human_description:
    en_US: Wait until the turn ends and its videos are ready (up to the maximum wait).
    zh_Hans: 等待本轮结束且视频就绪（不超过最长等待时间）。
    ja_JP: ターンが終わり動画ができるまで待ちます（最大待機時間まで）。
    pt_BR: Aguarda o turno terminar e os vídeos ficarem prontos (até o tempo máximo).
  llm_description: true to wait until the turn ends and queued videos finish.
  form: llm
  default: false
- name: max_wait_seconds
  type: number
  required: false
  label:
    en_US: Maximum wait (seconds)
    zh_Hans: 最长等待（秒）
    ja_JP: 最大待機時間（秒）
    pt_BR: Espera máxima (segundos)
  human_description:
    en_US: How long to wait, 10 to 420 seconds (default 120). A job still running is returned with its id.
    zh_Hans: 最长等待时间，10 到 420 秒（默认 120）。仍在运行的任务会连同 ID 一起返回。
    ja_JP: 待機時間は 10〜420 秒（既定 120）。実行中のジョブは ID とともに返されます。
    pt_BR: Quanto esperar, de 10 a 420 segundos (padrão 120). Um job ainda em execução é retornado com seu ID.
  form: form
  default: 120
  min: 10
  max: 420
- name: return_file
  type: boolean
  required: false
  label:
    en_US: Attach the files
    zh_Hans: 附加文件
    ja_JP: ファイルを添付
    pt_BR: Anexar os arquivos
  human_description:
    en_US: Download the finished images or videos and return them as files (up to 150 MB each).
    zh_Hans: 下载生成的图片或视频并作为文件返回（每个最大 150 MB）。
    ja_JP: 完成した画像や動画をダウンロードしてファイルとして返します（各 150 MB まで）。
    pt_BR: Baixa as imagens ou vídeos prontos e retorna como arquivos (até 150 MB cada).
  form: form
  default: false
