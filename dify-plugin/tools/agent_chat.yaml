    pt_BR: Aguardar a resposta
  human_description:
    en_US: Wait until the agent's turn ends (up to the maximum wait).
    zh_Hans: 等待智能体本轮结束（不超过最长等待时间）。
    ja_JP: エージェントのターンが終わるまで待ちます（最大待機時間まで）。
    pt_BR: Aguarda o turno do agente terminar (até o tempo máximo).
