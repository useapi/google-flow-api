# Generated by dev/gen_tools.py from dev/specs.py. Edit the specs, then re-run the generator.
identity:
  name: agent_chat
  author: useapi
  label:
    en_US: Google Flow agent chat
    zh_Hans: Google Flow 智能体对话
    ja_JP: Google Flow エージェントとチャット
    pt_BR: Chat com o agente do Google Flow
description:
  human:
    en_US: 'Chat with the Google Flow agent: it plans, writes storyboards and makes images and videos with the Google Flow models. Start a chat or continue one.'
    zh_Hans: 与 Google Flow 智能体对话：它会规划、编写分镜，并用 Google Flow 模型生成图片和视频。可开始新对话或继续已有对话。
    ja_JP: Google Flow エージェントとチャット：企画や絵コンテを作り、Google Flow のモデルで画像や動画を作ります。新しいチャットも続きも可能。
    pt_BR: 'Converse com o agente do Google Flow: ele planeja, escreve storyboards e cria imagens e vídeos com os modelos do Google Flow. Comece ou continue um chat.'
  llm: 'Send a message to the Google Flow agent (Google''s own creative agent: it plans, writes storyboards and generates images and videos). Without chat_id a new chat starts; with chat_id the message continues it (one turn at a time). Give images, a video, voices and characters as references and name them in the message as @referenceImage_1, @referenceVideo_1, @referenceAudio_1, @character_1. Returns the agent''s reply, the status (idle / waiting_approval / failed / running), media ids and links. Chatting uses one captcha per turn; what the agent generates costs Google Flow credits, and in ask mode it asks first: then call agent_answer_approval after asking the user.'
parameters:
- name: message
  type: string
  required: true
  label:
    en_US: Message
    zh_Hans: 消息
    ja_JP: メッセージ
    pt_BR: Mensagem
  human_description:
    en_US: What you say to the agent.
    zh_Hans: 你要对智能体说的话。
    ja_JP: エージェントへのメッセージ。
    pt_BR: O que você diz ao agente.
  llm_description: What to say to the agent (up to 20,000 characters).
  form: llm
- name: chat_id
  type: string
  required: false
  label:
    en_US: Chat ID
    zh_Hans: 对话 ID
    ja_JP: チャット ID
    pt_BR: ID do chat
  human_description:
    en_US: 'Optional. Continue this chat. Empty: start a new chat.'
    zh_Hans: 可选。继续此对话。留空：开始新对话。
    ja_JP: 任意。このチャットを続けます。空欄なら新しいチャット。
    pt_BR: 'Opcional. Continua este chat. Vazio: começa um novo.'
  llm_description: Optional chat_id from an earlier agent_chat to continue that chat. Leave empty for a new chat.
  form: llm
- name: reference_images
  type: string
  required: false
  label:
    en_US: Reference image IDs
    zh_Hans: 参考图片 ID
    ja_JP: 参照画像 ID
    pt_BR: IDs de imagens de referência
  human_description:
    en_US: Optional media ids of reference images, one per line (up to 7).
    zh_Hans: 可选。参考图片的媒体 ID，每行一个（最多 7 个）。
    ja_JP: 任意。参照画像のメディア ID を 1 行に 1 つ（最大 7 件）。
    pt_BR: IDs de mídia opcionais de imagens de referência, um por linha (até 7).
  llm_description: Optional media ids of reference images, separated by new lines or commas (up to 7). Not together with start or end images.
  form: llm
- name: reference_image_files
  type: files
  required: false
  label:
    en_US: Reference image files
    zh_Hans: 参考图片文件
    ja_JP: 参照画像ファイル
    pt_BR: Arquivos de imagens de referência
  human_description:
    en_US: Optional. Or upload reference images here (with the ids, up to 7 in all).
    zh_Hans: 可选。也可以在这里上传参考图片（与 ID 合计最多 7 张）。
    ja_JP: 任意。参照画像をここでアップロードすることもできます（ID と合わせて最大 7 枚）。
    pt_BR: Opcional. Ou envie imagens de referência aqui (com os IDs, até 7 no total).
  llm_description: Optional image files used as reference images after the ids (up to 7 in all).
  form: llm
- name: reference_video
  type: string
  required: false
  label:
    en_US: Reference video ID
    zh_Hans: 参考视频 ID
    ja_JP: 参照動画 ID
    pt_BR: ID do vídeo de referência
  human_description:
    en_US: Optional media id of a video.
    zh_Hans: 可选。视频的媒体 ID。
    ja_JP: 任意。動画のメディア ID。
    pt_BR: ID de mídia opcional de um vídeo.
  llm_description: Optional media id of a video, named @referenceVideo_1 in the message.
  form: llm
- name: reference_video_file
  type: file
  required: false
  label:
    en_US: Reference video file
    zh_Hans: 参考视频文件
    ja_JP: 参照動画ファイル
    pt_BR: Arquivo do vídeo de referência
  human_description:
    en_US: Optional. Or upload an MP4 here.
    zh_Hans: 可选。也可以在这里上传 MP4。
    ja_JP: 任意。MP4 をここでアップロードすることもできます。
    pt_BR: Opcional. Ou envie um MP4 aqui.
  llm_description: Optional MP4 file used as the reference video when reference_video is empty.
  form: llm
- name: voices
  type: string
  required: false
  label:
    en_US: Voices
    zh_Hans: 声音
    ja_JP: 音声
    pt_BR: Vozes
  human_description:
    en_US: Optional built-in voice names or voice ids, one per line (up to 5).
    zh_Hans: 可选。内置声音名称或声音 ID，每行一个（最多 5 个）。
    ja_JP: 任意。組み込み音声名または音声 ID を 1 行に 1 つ（最大 5 件）。
    pt_BR: Nomes de vozes embutidas ou IDs de voz opcionais, um por linha (até 5).
  llm_description: Optional voices (built-in names like Kore, or voice ids from list_voices), up to 5, named @referenceAudio_N in the message.
  form: llm
- name: characters
