  human_description:
    en_US: Optional character ids from List characters, one per line (up to 7).
    zh_Hans: 可选。来自“列出角色”的角色 ID，每行一个（最多 7 个）。
    ja_JP: 任意。「キャラクター一覧」のキャラクター ID を 1 行に 1 つ（最大 7 件）。
    pt_BR: IDs de personagens opcionais de Listar personagens, um por linha (até 7).
  llm_description: Optional character ids from List characters, separated by new lines (up to 7). Name them in the prompt as @character_N.
  form: llm
