    ja_JP: Google アカウントのメール
    pt_BR: E-mail da conta Google
  human_description:
    en_US: 'Optional. Leave empty to rotate across all connected accounts (useapi.net picks a healthy one). Default: the email in the credentials.'
    zh_Hans: 可选。留空则在所有已连接账号间轮换（由 useapi.net 选择健康的账号）。默认：凭据中的邮箱。
    ja_JP: 任意。空欄にすると接続済みの全アカウントでローテーションします（useapi.net が正常なアカウントを選びます）。既定は認証情報のメール。
    pt_BR: 'Opcional. Deixe vazio para alternar entre todas as contas conectadas (a useapi.net escolhe uma saudável). Padrão: o e-mail das credenciais.'
  llm_description: Optional Google account email. Leave empty to rotate across all connected accounts. Media ids already pin the request to their own account.
  form: llm
- name: project_id
  type: string
  required: false
