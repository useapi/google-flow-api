identity:
  name: generate_video
  author: useapi
  label:
    en_US: Generate video
    zh_Hans: 生成视频
    ja_JP: 動画を生成
    pt_BR: Gerar vídeo
description:
  human:
    en_US: 'Make videos with sound with Veo 3.1 Lite or Omni 1.2 Flash: from text, start and end frames, reference images, characters and a voice, or edit a video with Omni 1.2 Flash.'
    zh_Hans: 使用 Veo 3.1 Lite 或 Omni 1.2 Flash 生成带声音的视频：可基于文本、首尾帧、参考图片、角色和声音，或用 Omni 1.2 Flash 编辑视频。
    ja_JP: Veo 3.1 Lite または Omni 1.2 Flash で音声付き動画を作成：テキスト、開始・終了フレーム、参照画像、キャラクター、音声から。Omni 1.2 Flash では動画の編集も可能。
    pt_BR: 'Gera vídeos com som com Veo 3.1 Lite ou Omni 1.2 Flash: a partir de texto, quadros inicial e final, imagens de referência, personagens e voz, ou edita um vídeo com Omni 1.2 Flash.'
  llm: 'Generate Google Flow videos with sound. Modes: text-to-video; start image (+ end image); reference images and characters (+ voice); or a video edit with reference_video (Omni 1.2 Flash). Spends the account''s Google Flow credits. Waits up to max_wait, else returns a jobid for get_job.'
