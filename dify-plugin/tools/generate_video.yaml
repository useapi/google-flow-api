    ja_JP: 動画の内容。参照を本文で指定できます：@referenceImage_1、@character_1、@referenceAudio_1。
    pt_BR: 'O que o vídeo mostra. Você pode citar referências no texto: @referenceImage_1, @character_1, @referenceAudio_1.'
  llm_description: The video prompt. It may name the references inline as @referenceImage_N, @character_N or @referenceAudio_1; each named one must be given.
