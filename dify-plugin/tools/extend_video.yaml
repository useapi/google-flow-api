      pt_BR: 720p
  - value: 360p
    label:
      en_US: 360p (Omni 1.2 Flash only)
      zh_Hans: 360p（仅 Omni 1.2 Flash）
      ja_JP: 360p（Omni 1.2 Flash のみ）
      pt_BR: 360p (só Omni 1.2 Flash)
