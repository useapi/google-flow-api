# Generated by dev/gen_tools.py from dev/specs.py. Edit the specs, then re-run the generator.
identity:
  name: extend_video
  author: useapi
  label:
    en_US: Extend video
    zh_Hans: 延长视频
    ja_JP: 動画を延長
    pt_BR: Estender vídeo
description:
  human:
    en_US: Add 3 to 10 seconds to a video and get one continuous clip. Omni 1.2 Flash needs a paid plan; Veo 3.1 Lite works on every plan.
    zh_Hans: 为视频追加 3 到 10 秒，得到一段连续的视频。Omni 1.2 Flash 需付费方案；Veo 3.1 Lite 适用于所有方案。
    ja_JP: 動画に 3〜10 秒を追加して 1 本の連続した動画にします。Omni 1.2 Flash は有料プラン、Veo 3.1 Lite は全プランで利用可。
    pt_BR: Acrescenta 3 a 10 segundos a um vídeo e devolve um clipe contínuo. Omni 1.2 Flash exige plano pago; Veo 3.1 Lite funciona em todos.
  llm: Extend a Google Flow video (shorter than 30 s) with what happens next. omni-flash-1.2 (default, paid plans) adds duration 3 to 10 s and takes references; Veo models add a fixed length. Waits up to max_wait, else returns a jobid for get_job.
parameters:
- name: prompt
  type: string
  required: true
  label:
    en_US: What happens next
    zh_Hans: 接下来发生什么
    ja_JP: 続きの内容
    pt_BR: O que acontece a seguir
  human_description:
    en_US: Describe what happens next.
    zh_Hans: 描述接下来发生的内容。
    ja_JP: 続きの内容を書いてください。
    pt_BR: Descreva o que acontece a seguir.
  llm_description: What happens next in the video.
  form: llm
- name: video
  type: string
  required: false
  label:
    en_US: Video ID
    zh_Hans: 视频 ID
    ja_JP: 動画 ID
    pt_BR: ID do vídeo
  human_description:
    en_US: Media id of the video (from Generate video, List media or Upload).
    zh_Hans: 视频的媒体 ID（来自“生成视频”“列出媒体”或“上传”）。
    ja_JP: 動画のメディア ID（「動画を生成」「メディア一覧」「アップロード」から）。
    pt_BR: ID de mídia do vídeo (de Gerar vídeo, Listar mídia ou Enviar).
  llm_description: Media id of the video to extend (shorter than 30 seconds), e.g. user:12345-email:...-video:... Give this or video_file.
  form: llm
- name: video_file
  type: file
  required: false
  label:
    en_US: Video file
    zh_Hans: 视频文件
    ja_JP: 動画ファイル
    pt_BR: Arquivo de vídeo
  human_description:
    en_US: Or upload an MP4 here (up to 100 MB).
    zh_Hans: 也可以在这里上传 MP4（最大 100 MB）。
    ja_JP: または MP4 をここでアップロード（100 MB まで）。
    pt_BR: Ou envie um MP4 aqui (até 100 MB).
  llm_description: Optional MP4 file of the video to extend (shorter than 30 seconds), used when video is empty.
  form: llm
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
    ja_JP: モデル
    pt_BR: Modelo
  human_description:
    en_US: Omni 1.2 Flash (default, paid plans), Veo 3.1 Lite, or Veo 3.1 Lite Lower Priority (Google AI Ultra $199 only).
    zh_Hans: Omni 1.2 Flash（默认，付费方案）、Veo 3.1 Lite，或 Veo 3.1 Lite 低优先级（仅限 Google AI Ultra $199）。
    ja_JP: Omni 1.2 Flash（既定、有料プラン）、Veo 3.1 Lite、または Veo 3.1 Lite 低優先度（Google AI Ultra $199 のみ）。
    pt_BR: Omni 1.2 Flash (padrão, planos pagos), Veo 3.1 Lite ou Veo 3.1 Lite Lower Priority (só Google AI Ultra $199).
  llm_description: 'Extend model: omni-flash-1.2 (default, paid plans), veo-3.1-lite (every plan) or veo-3.1-lite-low-priority (Google AI Ultra $199 owner only).'
  form: llm
  default: omni-flash-1.2
  options:
  - value: omni-flash-1.2
    label:
      en_US: Omni 1.2 Flash (paid plans)
      zh_Hans: Omni 1.2 Flash（付费方案）
      ja_JP: Omni 1.2 Flash（有料プラン）
      pt_BR: Omni 1.2 Flash (planos pagos)
  - value: veo-3.1-lite
    label:
      en_US: Veo 3.1 Lite (every plan)
      zh_Hans: Veo 3.1 Lite（所有方案）
      ja_JP: Veo 3.1 Lite（全プラン）
      pt_BR: Veo 3.1 Lite (todos os planos)
  - value: veo-3.1-lite-low-priority
    label:
      en_US: Veo 3.1 Lite Lower Priority (Google AI Ultra $199 only)
      zh_Hans: Veo 3.1 Lite 低优先级（仅限 Google AI Ultra $199）
      ja_JP: Veo 3.1 Lite 低優先度（Google AI Ultra $199 のみ）
      pt_BR: Veo 3.1 Lite Lower Priority (só Google AI Ultra $199)
- name: duration
  type: number
  required: false
  label:
    en_US: Seconds to add
    zh_Hans: 追加秒数
    ja_JP: 追加する秒数
    pt_BR: Segundos a acrescentar
  human_description:
    en_US: 'Omni 1.2 Flash only: 3 to 10 (default 8).'
    zh_Hans: 仅 Omni 1.2 Flash：3 到 10（默认 8）。
    ja_JP: Omni 1.2 Flash のみ：3〜10（既定 8）。
    pt_BR: 'Só Omni 1.2 Flash: 3 a 10 (padrão 8).'
  llm_description: 'Omni 1.2 Flash only: seconds to add, 3 to 10. Default 8.'
  form: llm
