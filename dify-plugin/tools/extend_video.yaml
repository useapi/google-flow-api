    zh_Hans: 仅 Omni 1.2 Flash。默认与原视频相同。
    ja_JP: Omni 1.2 Flash のみ。既定は元動画と同じ。
    pt_BR: 'Só Omni 1.2 Flash. Padrão: a do vídeo de origem.'
  llm_description: 'Omni 1.2 Flash only. Default: the source''s. One of: 720p, 360p.'
  form: llm
  options:
  - value: 720p
    label:
      en_US: 720p
      zh_Hans: 720p
