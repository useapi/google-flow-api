    pt_BR: Gera imagens com Nano Banana 2 Lite, Nano Banana 2.1 ou Nano Banana Pro, a partir de texto e até 10 imagens de referência ou personagens. Imagens não gastam créditos do Google Flow.
  llm: Generate Google Flow images (no Google Flow credits used). Returns the images as files, their media ids (usable as start or reference images for videos) and links.
